<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrintCode — Print</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="entry" class="sheet">
      <header class="strip">
        <span><a href="/">HOME</a></span>
        <span>PRINT</span>
        <span>v1.0</span>
      </header>

      <div class="masthead">
        <h1>PrintCode</h1>
      </div>

      <form id="code-form" novalidate>
        <div class="field">
          <label class="key" for="code-1">01 / 코드</label>
          <div class="val">
            <!-- 6칸으로 나눠 6자리라는 것을 바로 알 수 있게 한다 -->
            <div id="code-digits" class="digits" role="group" aria-label="코드 6자리">
              <input id="code-1" class="digit" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="1번째 숫자" />
              <input class="digit" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="2번째 숫자" />
              <input class="digit" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="3번째 숫자" />
              <input class="digit" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="4번째 숫자" />
              <input class="digit" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="5번째 숫자" />
              <input class="digit" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="6번째 숫자" />
            </div>
          </div>
        </div>
        <div id="phrase-row" class="field" hidden>
          <label class="key" for="phrase">02 / 확인코드</label>
          <div class="val">
            <!-- type=password는 한글 입력기를 꺼버리므로 일반 텍스트. autocomplete=off로 공용 PC 입력 기록에 남기지 않는다 -->
            <input id="phrase" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"/>
          </div>
        </div>
        <button type="submit" id="submit">NEXT</button>
      </form>

      <output id="status" class="status" role="status"></output>
      <div class="hazard" aria-hidden="true"></div>
    </main>
    <div id="print-area"></div>
    <script type="module" src="/src/print.js"></script>
  </body>
</html>
