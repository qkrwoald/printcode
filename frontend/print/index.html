<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrintCode — 출력</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="entry" class="sheet">
      <div class="hazard" aria-hidden="true"></div>
      <header class="strip">
        <span>REV M1</span>
        <span>UNIT / PRINT</span>
        <span>NO DISK · NO LOGIN</span>
      </header>

      <div class="masthead">
        <h1>PrintCode</h1>
        <p>노트북에서 받은 6자리 코드를 입력하세요.</p>
      </div>

      <form id="code-form" novalidate>
        <div class="field">
          <label class="key" for="code">01 / Code<small>숫자 6자리</small></label>
          <div class="val">
            <input id="code" class="code-input" inputmode="numeric" autocomplete="off" maxlength="6" />
          </div>
        </div>
        <div id="phrase-row" class="field" hidden>
          <label class="key" for="phrase">02 / Phrase<small>업로드할 때 정한 확인코드</small></label>
          <div class="val">
            <input id="phrase" type="password" autocomplete="off" spellcheck="false" />
          </div>
        </div>
        <button type="submit" id="submit">다음</button>
      </form>

      <output id="status" class="status" role="status"></output>

      <ul class="notes">
        <li>이 PC에는 파일이 저장되지 않습니다. 인쇄가 끝나면 화면과 메모리에서 문서를 지웁니다.</li>
        <li>양면 인쇄는 인쇄 창에서 직접 선택하세요.</li>
      </ul>
    </main>
    <div id="print-area"></div>
    <script type="module" src="/src/print.js"></script>
  </body>
</html>
