<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrintCode — Upload</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="entry" class="sheet">
      <header class="strip">
        <span><a href="/">HOME</a></span>
        <span>UPLOAD</span>
        <span>v0.1</span>
      </header>

      <div class="masthead">
        <h1>PrintCode</h1>
      </div>

      <form id="upload-form" novalidate>
        <div class="field">
          <label class="key" for="file">01 / 파일</label>
          <div class="val file-row">
            <!-- 기본 파일 칸의 "선택된 파일 없음" 문구를 숨기고, 선택한 파일 이름만 보여준다 -->
            <input type="file" id="file" class="visually-hidden" accept="application/pdf,.pdf" />
            <label for="file" class="pick">파일선택</label>
            <span id="file-name" class="file-name"></span>
          </div>
        </div>
        <div class="field">
          <label class="key" for="phrase">02 / 확인코드</label>
          <div class="val">
            <!-- type=password는 브라우저가 한글 입력기를 꺼버려 한글 확인코드를 칠 수 없으므로 일반 텍스트로 둔다 -->
            <input type="text" id="phrase" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="(선택)" />
          </div>
        </div>

        <!-- 출력 설정: 파일을 고르면 접힌 상태로 나타나고, 눌러야 펼쳐진다 (설정이 필요 없는 사람이 많음).
             암호화 전에 PDF 자체에 반영된다 -->
        <div id="settings" hidden>
          <button type="button" id="settings-toggle" class="field toggle" aria-expanded="false" aria-controls="settings-body">
            <span class="key">03 / 출력 설정</span>
            <span class="val toggle-val">
              <span class="toggle-mark" aria-hidden="true"></span>
            </span>
          </button>
          <div id="settings-body" hidden>
          <div class="field">
            <label class="key" for="pages">04 / 쪽 범위</label>
            <div class="val">
              <input type="text" id="pages" autocomplete="off" spellcheck="false" placeholder="1-3, 5" />
            </div>
          </div>
          <div class="field">
            <label class="key" for="copies">05 / 부수</label>
            <div class="val">
              <div class="stepper">
                <button type="button" id="copies-down" aria-label="1부 줄이기">−</button>
                <input type="text" id="copies" inputmode="numeric" autocomplete="off" value="1" />
                <button type="button" id="copies-up" aria-label="1부 늘리기">+</button>
              </div>
            </div>
          </div>
          <div class="field">
            <span class="key" id="nup-label">06 / 모아찍기</span>
            <div class="val">
              <div class="seg" role="radiogroup" aria-labelledby="nup-label">
                <label><input type="radio" name="nup" value="1" checked /><span>1</span></label>
                <label><input type="radio" name="nup" value="2" /><span>2</span></label>
                <label><input type="radio" name="nup" value="4" /><span>4</span></label>
              </div>
            </div>
          </div>
          <div class="field">
            <span class="key" id="orient-label">07 / 방향</span>
            <div class="val">
              <div class="seg" role="radiogroup" aria-labelledby="orient-label">
                <label><input type="radio" name="orientation" value="auto" checked /><span>자동</span></label>
                <label><input type="radio" name="orientation" value="portrait" /><span>세로</span></label>
                <label><input type="radio" name="orientation" value="landscape" /><span>가로</span></label>
              </div>
            </div>
          </div>
          <section class="preview" aria-labelledby="preview-head">
            <p id="preview-head" class="result-head">PREVIEW</p>
            <div id="thumbs" class="thumbs"></div>
          </section>
          </div>
        </div>

        <button type="submit">UPLOAD</button>
      </form>

      <output id="status" class="status" role="status"></output>

      <section id="result" hidden>
        <p id="result-head" class="result-head">CODE</p>
        <samp id="code" class="code"></samp>
        <p id="timer-row" class="timer-row"><span id="timer-label">TIME LEFT</span><time id="timer" role="timer">30:00</time></p>
        <button type="button" id="again" class="secondary">UPLOAD MORE</button>
      </section>

    </main>
    <script type="module" src="/src/upload.js"></script>
  </body>
</html>
